[package]
name = "prompt-generator"
version = "0.1.1"
description = "提示词生成器 Prompt Generator — 把模糊需求转化为结构化、无歧义的高质量提示词"
authors = ["NHKH-RGB"]
license = "MIT"
repository = "https://github.com/NHKH-RGB/prompt-generator"
edition = "2024"
rust-version = "1.90"

[lib]
name = "prompt_generator_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.0", features = [] }
